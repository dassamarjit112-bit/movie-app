<!-- CineStream — Detail Page -->
<link rel="stylesheet" href="../css/detail.css">
<div id="detail-page" class="detail-page">
  <div id="navbar-mount"></div>
  <!-- Immersive Full-Bleed Hero Backdrop -->
  <div class="detail-hero-backdrop" id="detail-hero-backdrop">
    <img id="detail-backdrop-img" src="" alt="Backdrop" class="detail-backdrop-img" />
    <div class="detail-hero-overlay"></div>
  </div>

  <!-- Detail Content Container -->
  <div class="detail-content">
    <!-- Back Button -->
    <button class="btn btn-ghost btn-sm" onclick="history.back()" class="detail-back-btn">
      <span class="material-symbols-outlined" style="font-size:18px">arrow_back</span>
      <span>Back</span>
    </button>

    <!-- Main Movie Info Block -->
    <div class="detail-header-block">
      <div class="detail-badges">
        <span id="detail-type-badge" class="badge badge-red"></span>
        <span id="detail-genre-badge" class="badge badge-blue"></span>
        <span id="detail-rating-badge" class="badge badge-gold"></span>
        <span id="detail-format-badge" class="badge badge-green"
          style="background:rgba(20,209,255,0.1); color:var(--c-secondary-container); border:1px solid var(--c-secondary-container); display:none;">4K
          ULTRA HD</span>
      </div>
      <h1 id="detail-title" class="text-display-lg">Loading...</h1>
      <div class="detail-meta">
        <span id="detail-year"></span>
        <span>•</span>
        <span id="detail-duration"></span>
        <span>•</span>
        <span class="detail-rating-badge"
          style="border:1px solid rgba(255,255,255,0.3);border-radius:3px;padding:1px 6px;font-size:11px;font-weight:700;color:rgba(255,255,255,0.8); display:none;">PG-13</span>
        <span>•</span>
        <span style="color:#14d1ff;font-weight:600; display:none;">Dolby Atmos</span>
      </div>
      <p id="detail-description" class="text-body-lg"></p>
      <div class="detail-actions">
        <button id="detail-play-btn" class="btn btn-glow" style="padding:14px 32px; border-radius:14px; display:inline-flex; align-items:center; gap:10px; background:linear-gradient(135deg,#e50914,#b8000c); border:none; color:#fff; font-weight:800; font-size:15px; letter-spacing:0.03em; box-shadow:0 10px 30px rgba(229,9,20,0.5), inset 0 1px 0 rgba(255,255,255,0.25); cursor:pointer; transition:all 0.3s ease;">
          <span class="material-symbols-outlined icon-fill" style="font-size:26px">play_arrow</span>
          <span>PLAY NOW</span>
        </button>
        <button id="detail-download-btn" class="btn btn-glass" style="padding:14px 28px; border-radius:14px; display:inline-flex; align-items:center; gap:10px; background:rgba(20,209,255,0.08); border:1.5px solid rgba(20,209,255,0.35); color:#14d1ff; font-weight:800; font-size:14px; letter-spacing:0.03em; box-shadow:0 8px 24px rgba(20,209,255,0.18); cursor:pointer; transition:all 0.3s ease; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);">
          <span class="material-symbols-outlined" style="font-size:22px">download</span>
          <span>DOWNLOAD</span>
        </button>
        <button id="detail-watchlist-btn" class="btn btn-glass" style="padding:14px 24px; border-radius:14px; display:inline-flex; align-items:center; gap:10px; background:rgba(255,255,255,0.04); border:1.5px solid rgba(255,255,255,0.14); color:rgba(229,226,225,0.9); font-weight:800; font-size:14px; letter-spacing:0.03em; box-shadow:0 6px 20px rgba(0,0,0,0.35); cursor:pointer; transition:all 0.3s ease; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);">
          <span class="material-symbols-outlined" id="watchlist-icon" style="font-size:20px; color:rgba(229,226,225,0.85);">bookmark_add</span>
          <span id="watchlist-text">WATCHLIST</span>
        </button>
        <button class="btn btn-icon-circle" title="Share" onclick="UI.toast('Link copied to clipboard!', 'success')" style="width:50px; height:50px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); color:rgba(229,226,225,0.85); cursor:pointer; transition:all 0.3s ease; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);">
          <span class="material-symbols-outlined" style="font-size:20px">share</span>
        </button>
        <button class="btn btn-icon-circle" title="Like" onclick="UI.toast('Added to liked titles!', 'success')" style="width:50px; height:50px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12); color:rgba(229,226,225,0.85); cursor:pointer; transition:all 0.3s ease; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);">
          <span class="material-symbols-outlined" style="font-size:20px">thumb_up</span>
        </button>
      </div>
    </div>

    <style>
      .btn-glow { position:relative; overflow:hidden; transition:all 0.35s cubic-bezier(0.4,0,0.2,1); }
      .btn-glow:hover { transform:translateY(-3px) scale(1.03); box-shadow:0 14px 36px rgba(229,9,20,0.65), inset 0 1px 0 rgba(255,255,255,0.3); }
      .btn-glow:active { transform:translateY(0) scale(0.97); }
      
      .btn-glass { position:relative; overflow:hidden; transition:all 0.35s cubic-bezier(0.4,0,0.2,1); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
      .btn-glass:hover { transform:translateY(-3px) scale(1.03); background:rgba(255,255,255,0.09) !important; border-color:rgba(255,255,255,0.28) !important; box-shadow:0 10px 28px rgba(0,0,0,0.5); }
      .btn-glass:active { transform:translateY(0) scale(0.97); }
      
      .btn-icon-circle { transition:all 0.35s cubic-bezier(0.4,0,0.2,1); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
      .btn-icon-circle:hover { transform:translateY(-3px) scale(1.1); background:rgba(255,255,255,0.1) !important; border-color:rgba(255,255,255,0.28) !important; box-shadow:0 10px 24px rgba(0,0,0,0.55); }
      .btn-icon-circle:active { transform:translateY(0) scale(0.93); }
      
      .btn-glow::before, .btn-glass::before { content:''; position:absolute; top:50%; left:50%; width:0; height:0; border-radius:50%; background:rgba(255,255,255,0.25); transform:translate(-50%,-50%); transition:width 0.6s, height 0.6s; }
      .btn-glow:active::before, .btn-glass:active::before { width:400px; height:400px; }
      
      @keyframes pulse-glow { 0%,100%{box-shadow:0 10px 30px rgba(229,9,20,0.5)} 50%{box-shadow:0 14px 42px rgba(229,9,20,0.75), 0 0 60px rgba(229,9,20,0.35)} }
      .btn-glow { animation: pulse-glow 2.5s ease-in-out infinite; }
    </style>

    <!-- Secondary Info Grid -->
    <div class="detail-grid">
      <!-- Left: Season Selector / Cast List -->
      <div class="detail-left">
        <!-- TV Show Seasons & Episodes (only shown if type is series) -->
        <div id="episodes-section" class="detail-episodes" style="display:none">
          <div class="detail-season-header">
            <h3 class="text-headline-md">Episodes</h3>
            <select id="season-selector" class="input-field"
              style="width:auto;padding:8px 16px;border-radius:8px;cursor:pointer">
              <option value="1">Loading Seasons...</option>
            </select>
          </div>
          <div id="episodes-list" class="detail-episodes-list">
            <!-- Dynamically populated episodes -->
          </div>
        </div>
        <!-- Cast & Crew -->
        <div class="detail-cast">
          <h3 class="text-headline-sm">Cast &amp; Crew</h3>
          <div class="cast-row"
            style="display:flex; flex-direction:row; gap:20px; overflow-x:auto; padding-bottom:12px; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.15) transparent;">
            <!-- Cast cards will be injected here -->
          </div>
        </div>
      </div>

      <!-- Right: Detailed Specs / Metadata -->
      <div class="detail-right">
        <div class="glass-card" style="padding:24px;border-radius:12px;">
          <h4 class="text-label-md"
            style="font-size:14px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:16px;">
            Production Specifications</h4>
          <div class="detail-specs-list">
            <div class="detail-spec-item"><span class="spec-label">Audio Codec</span><span class="spec-value"
                style="color:var(--c-secondary-container)">AAC / E-AC3</span></div>
            <div class="detail-spec-item"><span class="spec-label">Quality</span><span class="spec-value"
                style="color:#ffc832">HD / 4K</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Recommendations -->
    <div class="detail-recommendations">
      <h3 class="text-headline-md" style="margin-bottom:24px;">More Like This</h3>
      <div class="scroll-row" id="detail-recommendations-row">
        <!-- Dynamically populated posters -->
      </div>
    </div>
  </div>



  <div id="footer-mount"></div>
  <div id="mobile-nav-mount"></div>
</div>
