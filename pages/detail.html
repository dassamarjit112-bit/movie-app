<!-- CineStream — Detail Page -->
<link rel="stylesheet" href="../css/detail.css">
<div id="detail-page" class="detail-page">
  <div id="navbar-mount"></div>
  <!-- Immersive Full-Bleed Hero Backdrop -->
  <div class="detail-hero-backdrop" id="detail-hero-backdrop">
    <img id="detail-backdrop-img" src="" alt="Backdrop" class="detail-backdrop-img" />
    <div class="detail-hero-overlay"></div>
  </div>

  <!-- Detail Content Container -->
  <div class="detail-content">
    <!-- Back Button -->
    <button class="btn btn-ghost btn-sm" onclick="history.back()" class="detail-back-btn">
      <span class="material-symbols-outlined" style="font-size:18px">arrow_back</span>
      <span>Back</span>
    </button>

    <!-- Main Movie Info Block -->
    <div class="detail-header-block">
      <div class="detail-badges">
        <span id="detail-type-badge" class="badge badge-red"></span>
        <span id="detail-genre-badge" class="badge badge-blue"></span>
        <span id="detail-rating-badge" class="badge badge-gold"></span>
        <span id="detail-format-badge" class="badge badge-green"
          style="background:rgba(20,209,255,0.1); color:var(--c-secondary-container); border:1px solid var(--c-secondary-container); display:none;">4K
          ULTRA HD</span>
      </div>
      <h1 id="detail-title" class="text-display-lg">Loading...</h1>
      <div class="detail-meta">
        <span id="detail-year"></span>
        <span>•</span>
        <span id="detail-duration"></span>
        <span>•</span>
        <span class="detail-rating-badge"
          style="border:1px solid rgba(255,255,255,0.3);border-radius:3px;padding:1px 6px;font-size:11px;font-weight:700;color:rgba(255,255,255,0.8); display:none;">PG-13</span>
        <span>•</span>
        <span style="color:#14d1ff;font-weight:600; display:none;">Dolby Atmos</span>
      </div>
      <p id="detail-description" class="text-body-lg"></p>
      <div class="detail-actions">
        <button id="detail-play-btn" class="btn btn-primary btn-lg">
          <span class="material-symbols-outlined icon-fill" style="font-size:24px">play_arrow</span>
          <span>PLAY NOW</span>
        </button>
        <button id="detail-watchlist-btn" class="btn btn-ghost btn-lg">
          <span class="material-symbols-outlined" id="watchlist-icon">bookmark_add</span>
          <span id="watchlist-text">Watchlist</span>
        </button>
        <button class="btn btn-icon" title="Share" onclick="UI.toast('Link copied to clipboard!', 'success')">
          <span class="material-symbols-outlined">share</span>
        </button>
        <button class="btn btn-icon" title="Like" onclick="UI.toast('Added to liked titles!', 'success')">
          <span class="material-symbols-outlined">thumb_up</span>
        </button>
      </div>
    </div>

    <!-- Secondary Info Grid -->
    <div class="detail-grid">
      <!-- Left: Season Selector / Cast List -->
      <div class="detail-left">
        <!-- TV Show Seasons & Episodes (only shown if type is series) -->
        <div id="episodes-section" class="detail-episodes" style="display:none">
          <div class="detail-season-header">
            <h3 class="text-headline-md">Episodes</h3>
            <select id="season-selector" class="input-field"
              style="width:auto;padding:8px 16px;border-radius:8px;cursor:pointer">
              <option value="1">Loading Seasons...</option>
            </select>
          </div>
          <div id="episodes-list" class="detail-episodes-list">
            <!-- Dynamically populated episodes -->
          </div>
        </div>
        <!-- Cast & Crew -->
        <div class="detail-cast">
          <h3 class="text-headline-sm">Cast &amp; Crew</h3>
          <div class="cast-row"
            style="display:flex; flex-direction:row; gap:20px; overflow-x:auto; padding-bottom:12px; scrollbar-width:thin; scrollbar-color:rgba(255,255,255,0.15) transparent;">
            <!-- Cast cards will be injected here -->
          </div>
        </div>
      </div>

      <!-- Right: Detailed Specs / Metadata -->
      <div class="detail-right">
        <div class="glass-card" style="padding:24px;border-radius:12px;">
          <h4 class="text-label-md"
            style="font-size:14px;font-weight:700;letter-spacing:0.05em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:16px;">
            Production Specifications</h4>
          <div class="detail-specs-list">
            <div class="detail-spec-item"><span class="spec-label">Audio Codec</span><span class="spec-value"
                style="color:var(--c-secondary-container)">AAC / E-AC3</span></div>
            <div class="detail-spec-item"><span class="spec-label">Quality</span><span class="spec-value"
                style="color:#ffc832">HD / 4K</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Recommendations -->
    <div class="detail-recommendations">
      <h3 class="text-headline-md" style="margin-bottom:24px;">More Like This</h3>
      <div class="scroll-row" id="detail-recommendations-row">
        <!-- Dynamically populated posters -->
      </div>
    </div>
  </div>

  <!-- ── Adcash Banner Ad ── -->
  <div style="display:flex;justify-content:center;align-items:center;padding:24px var(--space-margin-desktop, 64px);">
    <div>
      <script type="text/javascript">
        aclib.runBanner({ zoneId: '11473046' });
      </script>
    </div>
  </div>

  <div id="footer-mount"></div>
  <div id="mobile-nav-mount"></div>
</div>
