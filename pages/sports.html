  <!-- ── Subscribe CTA ── -->

  <style>
    /* ══════════════════════════════════════
   SPORTS PAGE — Premium OTT Design
   ══════════════════════════════════════ */
    .sp-root {
      --sp-green: #00d084;
      --sp-blue: #14d1ff;
      --sp-red: #e50914;
      --sp-gold: #ffc832;
      --sp-bg: #080b12;
      --sp-card: #0f1420;
      background: var(--sp-bg);
      min-height: 100vh;
    }

    /* ── Hero ── */
    .sp-hero {
      position: relative;
      min-height: 480px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      padding: 100px 64px 56px;
      overflow: hidden;
      gap: 40px;
    }

    .sp-hero-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background:
        linear-gradient(to right, rgba(8, 11, 18, 1) 0%, rgba(8, 11, 18, 0.7) 50%, rgba(8, 11, 18, 0.9) 100%),
        linear-gradient(to bottom, rgba(8, 11, 18, 0.1) 0%, rgba(8, 11, 18, 1) 95%),
        url('https://images.unsplash.com/photo-1574629810360-7efbbe195018?q=80&w=1920&auto=format&fit=crop') center 30%/cover no-repeat;
    }

    .sp-hero-content,
    .sp-hero-featured {
      position: relative;
      z-index: 2;
    }

    .sp-hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 208, 132, 0.12);
      border: 1px solid rgba(0, 208, 132, 0.4);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--sp-green);
      margin-bottom: 20px;
    }

    .sp-hero-title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(36px, 6vw, 72px);
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #fff;
      margin-bottom: 12px;
      line-height: 1;
    }

    .sp-hero-accent {
      color: var(--sp-green);
    }

    .sp-hero-sub {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 28px;
      font-weight: 500;
    }

    .sp-hero-stats {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .sp-stat {
      text-align: center;
    }

    .sp-stat-num {
      display: block;
      font-size: 28px;
      font-weight: 800;
      color: var(--sp-green);
      font-family: 'Montserrat', sans-serif;
    }

    .sp-stat-label {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      font-weight: 600;
    }

    .sp-stat-divider {
      width: 1px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
    }

    /* ── Hero Match Card ── */
    .sp-hero-match {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(16px);
    }

    .sp-hero-match-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 12px;
    }

    .sp-hero-teams {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .sp-hero-team {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .sp-hero-logo {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.06);
      padding: 8px;
    }

    .sp-hero-team-name {
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      color: rgba(255, 255, 255, 0.9);
      max-width: 100px;
      word-break: break-word;
    }

    .sp-hero-score-wrap {
      text-align: center;
    }

    .sp-hero-score {

      font-size: 32px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.05em;
    }

    .sp-hero-status {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
    }

    .sp-hero-match-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .sp-venue {

      color: rgba(255, 255, 255, 0.4);
    }

    .sp-watch-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 20px;
      border-radius: 8px;
      background: var(--sp-green);
      color: #000;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .sp-watch-btn:hover {
      opacity: 0.85;
      transform: scale(1.03);
    }

    /* ── Controls (Redesigned) ── */
    .sp-controls-wrap {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 0 64px 24px;
      position: relative;
    }

    .sp-row1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .sp-tab-all {
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      background: transparent;
      color: rgba(255, 255, 255, 0.55);
      transition: all 0.2s;
      white-space: nowrap;
    }

    .sp-tab-all.active,
    .sp-tab-all:hover {
      background: var(--sp-green);
      border-color: var(--sp-green);
      color: #000;
    }

    .sp-tabs-scroll {
      flex: 1;

      scrollbar-width: none;
      border-top: 1px solid rgba(255, 255, 255, 0.05);

      display: flex;
      gap: 8px;

    .sp-tab {
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid rgba(255, 255, 255, 0.12);

      color: rgba(255, 255, 255, 0.55);

      border-color: var(--sp-green);
      color: var(--sp-green);
    }

    .sp-search-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;

      max-width: 400px;
      color: rgba(255, 255, 255, 0.4);
      transition: all 0.2s;
    }

    .sp-search-wrap:focus-within {
      border-color: var(--sp-green);
      background: rgba(255, 255, 255, 0.08);
    }

    .sp-search-wrap input {
      background: none;
      border: none;
      outline: none;
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      flex: 1;
      font-family: 'Inter', sans-serif;
    }

    .sp-search-wrap .material-symbols-outlined {
      font-size: 18px;
    }

    /* ── Sections ── */
    .sp-section {
      padding: 0 64px 40px;
    }

    .sp-sec-hd {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .sp-sec-hd h2 {
      font-size: 18px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.9);
    }

    /* ── AI Suggestion Cards ── */
    .sp-suggest-row {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 8px;
    }

    .sp-suggest-row::-webkit-scrollbar {
      display: none;
    }

    .sp-suggest-card {
      min-width: 220px;
      max-width: 220px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;

      border-color: var(--sp-blue);
      background: rgba(20, 209, 255, 0.06);
      transform: translateY(-3px);
    }

    .sp-suggest-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

      letter-spacing: 0.08em;

    .sp-suggest-score {

    .sp-tournament-header {
      display: flex;

      margin-bottom: 16px;
      border-left: 4px solid var(--sp-red);

          rgba(255, 255, 255, 0.08) 50%,
          rgba(255, 255, 255, 0.04) 75%);
      background-size: 400%;
      animation: sp-shimmer 1.4s ease infinite;
    }

    @keyframes sp-shimmer {
      0% {
        background-position: 100%;
      }

      100% {
        background-position: 0%;
      }
    }
