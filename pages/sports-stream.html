<div id="sports-stream-page" style="min-height:100vh; background:#000; display:flex; flex-direction:column;">

  <!-- Back Button -->
  <div style="position:absolute; top:0; left:0; right:0; z-index:50; background:linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); padding: 20px 24px;">
    <button class="btn btn-ghost" onclick="Router.navigate('sports')" style="color:#fff; background:rgba(255,255,255,0.08); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.1);">
      <span class="material-symbols-outlined">arrow_back</span>
      Back to Sports
    </button>
  </div>

  <!-- Main Video Area -->
  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:80px;">

    <!-- Match Header -->
    <div id="stream-match-header" style="width:100%; max-width:1280px; padding:0 24px 16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
      <div style="display:flex; align-items:center; gap:16px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="width:10px; height:10px; background:#e50914; border-radius:50%; animation:pulse-live 1.5s infinite; flex-shrink:0;"></span>
          <span id="stream-status" style="font-size:12px; font-weight:800; color:#e50914; letter-spacing:0.12em;">LIVE</span>
        </div>
        <span id="stream-tournament" style="font-size:13px; color:rgba(255,255,255,0.5); background:rgba(255,255,255,0.06); padding:4px 10px; border-radius:8px;"></span>
      </div>
      <!-- Live Score Summary -->
      <div style="display:flex; align-items:center; gap:12px;">
        <img id="stream-home-logo" src="" style="width:28px; height:28px; border-radius:50%; object-fit:cover;" />
        <span id="stream-home-team" style="font-size:13px; font-weight:700; color:#fff;"></span>
        <span id="stream-score" style="font-size:16px; font-weight:900; font-family:monospace; background:rgba(255,255,255,0.1); padding:3px 10px; border-radius:8px; color:#fff;"></span>
        <span id="stream-away-team" style="font-size:13px; font-weight:700; color:#fff;"></span>
        <img id="stream-away-logo" src="" style="width:28px; height:28px; border-radius:50%; object-fit:cover;" />
      </div>
    </div>

    <!-- Video Iframe Container -->
    <div style="width:100%; max-width:1280px; padding:0 24px; position:relative;">
      <div style="aspect-ratio:16/9; background:#0a0a0f; border-radius:16px; overflow:hidden; box-shadow:0 32px 80px rgba(0,0,0,0.9); position:relative; border:1px solid rgba(255,255,255,0.06);">
        <!-- Iframe mode -->
        <iframe id="live-embed-frame"
          style="width:100%; height:100%; border:none; display:block;"
          allowfullscreen
          sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-top-navigation-by-user-activation"
          allow="autoplay; encrypted-media; fullscreen">
        </iframe>
        
        <!-- Native HLS Video mode -->
        <div id="native-video-container" style="display:none; width:100%; height:100%;" data-vjs-player>
          <video id="native-video-player" class="video-js vjs-default-skin vjs-16-9" playsinline controls preload="auto" style="width:100%; height:100%;"></video>
        </div>

        <!-- Loading state -->
        <div id="stream-loading" style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#0a0a0f; z-index: 10;">
          <div style="width:64px; height:64px; border-radius:50%; border:3px solid rgba(255,255,255,0.08); border-top-color:#e50914; animation:spin 1s linear infinite;"></div>
          <span style="font-size:14px; color:rgba(255,255,255,0.4);">Connecting to stream…</span>
        </div>
      </div>
    </div>

    <!-- Server Selector -->
    <div style="width:100%; max-width:1280px; padding:20px 24px 0;">
      <div style="background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); border-radius:16px; padding:20px;">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
          <span class="material-symbols-outlined" style="color:#e50914; font-size:20px;">dns</span>
          <span style="font-size:14px; font-weight:700; color:#fff; letter-spacing:0.03em;">Streaming Server</span>
          <span style="font-size:12px; color:rgba(255,255,255,0.3); margin-left:4px;">Switch if stream is slow or not loading</span>
        </div>
        <div id="server-selector-buttons" style="display:flex; gap:10px; flex-wrap:wrap;">
          <!-- Server buttons injected by JS -->
        </div>
      </div>
    </div>

    <!-- Info Bar -->
    <div style="width:100%; max-width:1280px; padding:16px 24px 40px;">
      <div style="display:flex; align-items:center; gap:8px; color:rgba(255,255,255,0.25); font-size:12px;">
        <span class="material-symbols-outlined" style="font-size:16px;">info</span>
        <span>All streams are sourced from public broadcasting embed services. FanCode requires a backend proxy to be configured.</span>
      </div>
    </div>

  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .server-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.05);
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .server-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.2);
      color: #fff;
    }
    .server-btn.active {
      background: rgba(229,9,20,0.15);
      border-color: rgba(229,9,20,0.5);
      color: #fff;
    }
    .server-btn .server-badge {
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      font-weight: 400;
    }
  </style>
</div>
