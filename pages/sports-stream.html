<div id="sports-stream-page" style="min-height:100vh; background:#000; display:flex; flex-direction:column;">

  <!-- Back Button -->
  <div style="position:absolute; top:0; left:0; right:0; z-index:50; background:linear-gradient(to bottom, rgba(0,0,0,0.9), transparent); padding: 20px 24px;">
    <button class="btn btn-ghost" onclick="Router.navigate('sports')" style="color:#fff; background:rgba(255,255,255,0.08); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.1);">
      <span class="material-symbols-outlined">arrow_back</span>
      Back to Sports
    </button>
  </div>

  <style>
    /* Cinematic Mobile Player */
    .sp-player-wrapper {
      width: 100%;
      max-width: 1280px;
      padding: 0 24px;
      position: relative;
    }
    .sp-player-inner {
      aspect-ratio: 16/9;
      background: #0a0a0f;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 32px 80px rgba(0,0,0,0.9);
      position: relative;
      border: 1px solid rgba(255,255,255,0.06);
    }
    @media (max-width: 768px) {
      .sp-player-wrapper {
        padding: 0;
        margin-top: 10px;
      }
      .sp-player-inner {
        border-radius: 0;
        border-left: none;
        border-right: none;
      }
    }
  </style>

  <!-- Main Video Area -->
  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:60px;">

    <!-- Match Header -->
    <div id="stream-match-header" style="width:100%; max-width:1280px; padding:0 24px 16px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
      <div style="display:flex; align-items:center; gap:16px;">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="width:10px; height:10px; background:#e50914; border-radius:50%; animation:pulse-live 1.5s infinite; flex-shrink:0;"></span>
          <span id="stream-status" style="font-size:12px; font-weight:800; color:#e50914; letter-spacing:0.12em;">LIVE</span>
        </div>
        <span id="stream-tournament" style="font-size:13px; color:rgba(255,255,255,0.5); background:rgba(255,255,255,0.06); padding:4px 10px; border-radius:8px;"></span>
      </div>
      <!-- Live Score Summary -->
      <div style="display:flex; align-items:center; gap:12px;">
        <img id="stream-home-logo" src="" style="width:28px; height:28px; border-radius:50%; object-fit:cover;" />
        <span id="stream-home-team" style="font-size:13px; font-weight:700; color:#fff;"></span>
        <span id="stream-score" style="font-size:16px; font-weight:900; font-family:monospace; background:rgba(255,255,255,0.1); padding:3px 10px; border-radius:8px; color:#fff;"></span>
        <span id="stream-away-team" style="font-size:13px; font-weight:700; color:#fff;"></span>
        <img id="stream-away-logo" src="" style="width:28px; height:28px; border-radius:50%; object-fit:cover;" />
      </div>
    </div>

    <!-- Video Iframe Container -->
    <div class="sp-player-wrapper">
      <div class="sp-player-inner">
        <!-- App Download / Redirect UI -->
        <div id="app-redirect-container" style="display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; height:100%; background:linear-gradient(135deg, #0f0c29, #302b63, #24243e); position:absolute; inset:0; padding:24px; text-align:center;">
          <h2 style="font-size:24px; font-weight:800; color:#fff; margin-bottom:12px;">Watch Matches in CricZ TV</h2>
          <p style="font-size:14px; color:rgba(255,255,255,0.7); max-width:400px; margin-bottom:32px;">For the best live streaming experience without interruptions, please download and install our official app.</p>
          
          <button id="btn-watch-app" style="background:#e50914; color:#fff; border:none; padding:16px 32px; font-size:16px; font-weight:700; border-radius:12px; cursor:pointer; box-shadow:0 8px 24px rgba(229,9,20,0.4); display:flex; align-items:center; gap:12px; transition:transform 0.2s;">
            <span class="material-symbols-outlined">play_circle</span>
            Watch Match
          </button>
          
          <p style="font-size:12px; color:rgba(255,255,255,0.4); margin-top:24px;">If you already have the app installed, it will open automatically. Otherwise, it will download.</p>
        </div>
      </div>
    </div>

  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</div>
