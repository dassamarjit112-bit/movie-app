<!-- CineStream — Select Country Page -->
<div class="flex-center" style="min-height:100vh; padding:20px; background:radial-gradient(circle at top, rgba(20,209,255,0.05) 0%, transparent 70%);">
  <div class="glass-card animate-fade-up" style="max-width:480px; width:100%; padding:40px; border-radius:24px; text-align:center;">
    <div style="margin-bottom:30px;">
      <span class="material-symbols-outlined" style="font-size:64px; color:var(--c-primary-container);">public</span>
      <h2 class="text-headline-md" style="margin-top:16px; font-size:28px;">Welcome to CineStream</h2>
      <p style="color:rgba(229,226,225,0.6); margin-top:8px; font-size:15px; line-height:1.6;">
        To provide you with the best experience and accurate subscription pricing, please select your country.
      </p>
    </div>
    
    <div style="text-align:left; margin-bottom:30px;">
      <label class="input-label" style="font-size:13px; font-weight:600; display:block; margin-bottom:8px;">Select Country</label>
      <select id="sc-country-select" class="input-field" style="border-radius:12px; font-size:15px; padding:16px; background:rgba(255,255,255,0.03); color:#fff; border:1px solid rgba(255,255,255,0.1); width:100%; appearance:none;">
        <option value="" disabled selected>Choose your country...</option>
        <option value="india" style="background:#1a1a2e">India</option>
        <option value="usa" style="background:#1a1a2e">USA / Global</option>
        <option value="uk" style="background:#1a1a2e">UK</option>
        <option value="canada" style="background:#1a1a2e">Canada</option>
        <option value="australia" style="background:#1a1a2e">Australia</option>
      </select>
    </div>
    
    <button id="sc-continue-btn" class="btn btn-primary" style="width:100%; padding:16px; font-size:16px; font-weight:700; border-radius:12px;">
      Continue
    </button>
  </div>
</div>
