<!-- CineStream — TV Shows Page v2 -->
<div id="tvshows-page">
  <div id="navbar-mount"></div>

  <!-- Header -->
  <div
    style="padding:100px var(--space-margin-desktop) 0;background:linear-gradient(to bottom,rgba(20,209,255,0.07) 0%,transparent 100%)">
    <div style="max-width:var(--space-container-max);margin:0 auto">
      <div class="badge badge-blue" style="margin-bottom:12px">Series &amp; Shows</div>
      <h1 class="text-display-md" style="margin-bottom:8px">TV Shows</h1>
      <p style="color:rgba(229,226,225,0.55);font-size:16px">Binge-worthy series — Hindi · English · Crime · Drama ·
        Sci-Fi</p>
    </div>
  </div>

  <!-- Search + Filter Bar -->
  <div
    style="padding:24px var(--space-margin-desktop);position:sticky;top:72px;z-index:40;background:rgba(14,14,14,0.88);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,0.06)">
    <div
      style="max-width:var(--space-container-max);margin:0 auto;display:flex;gap:12px;flex-wrap:wrap;align-items:center">
      <!-- AI Search -->
      <div
        style="flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.05);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;padding:10px 16px;transition:border-color .2s"
        onfocusin="this.style.borderColor='rgba(20,209,255,0.5)'"
        onfocusout="this.style.borderColor='rgba(255,255,255,0.1)'">
        <span class="material-symbols-outlined" style="font-size:18px;color:rgba(229,226,225,0.4)">search</span>
        <input id="show-search" type="text" placeholder="AI Search — series, genres, actors…"
          style="background:none;border:none;outline:none;color:var(--c-on-surface);font-size:14px;width:100%"
          oninput="TVShowsPage.search(this.value)">
        <span
          style="font-size:9px;font-weight:800;padding:2px 6px;border-radius:4px;background:rgba(20,209,255,0.12);color:var(--c-secondary-container);border:1px solid rgba(20,209,255,0.25);flex-shrink:0">AI</span>
      </div>
      <!-- Genre -->
      <select id="show-genre" class="input-field" style="width:auto;padding:10px 16px;cursor:pointer"
        onchange="TVShowsPage.filter()">
        <option value="">All Genres</option>
        <option value="Crime">Crime</option>
        <option value="Sci-Fi">Sci-Fi</option>
        <option value="Documentary">Documentary</option>
        <option value="Drama">Drama</option>
        <option value="Thriller">Thriller</option>
        <option value="Comedy">Comedy</option>
        <option value="Fantasy">Fantasy</option>
        <option value="Action">Action</option>
        <option value="Horror">Horror</option>
        <option value="Mystery">Mystery</option>
        <option value="Romance">Romance</option>
      </select>
      <!-- Sort -->
      <select id="show-sort" class="input-field" style="width:auto;padding:10px 16px;cursor:pointer"
        onchange="TVShowsPage.filter()">
        <option value="trending">Trending</option>
        <option value="rating">Top Rated</option>
        <option value="newest">Newest</option>
      </select>
      <span id="show-count" style="font-size:13px;color:rgba(229,226,225,0.4);white-space:nowrap"></span>
    </div>
  </div>

  <!-- Loading Skeletons -->
  <div id="shows-loading"
    style="padding:32px var(--space-margin-desktop);max-width:var(--space-container-max);margin:0 auto">
    <div
      style="height:24px;width:220px;background:rgba(255,255,255,0.06);border-radius:6px;margin-bottom:16px;animation:skeleton-pulse 1.5s ease infinite">
    </div>
    <div class="scroll-row" style="gap:14px;padding-bottom:12px">
      <div class="skeleton" style="width:150px;height:225px;border-radius:8px;flex-shrink:0"></div>
      <div class="skeleton" style="width:150px;height:225px;border-radius:8px;flex-shrink:0"></div>
      <div class="skeleton" style="width:150px;height:225px;border-radius:8px;flex-shrink:0"></div>
      <div class="skeleton" style="width:150px;height:225px;border-radius:8px;flex-shrink:0"></div>
      <div class="skeleton" style="width:150px;height:225px;border-radius:8px;flex-shrink:0"></div>
    </div>
    <div
      style="height:24px;width:180px;background:rgba(255,255,255,0.06);border-radius:6px;margin:28px 0 16px;animation:skeleton-pulse 1.5s ease infinite">
    </div>
    <div class="scroll-row" style="gap:14px;padding-bottom:12px">
      <div class="skeleton" style="width:150px;height:225px;border-radius:8px;flex-shrink:0"></div>
      <div class="skeleton" style="width:150px;height:225px;border-radius:8px;flex-shrink:0"></div>
      <div class="skeleton" style="width:150px;height:225px;border-radius:8px;flex-shrink:0"></div>
      <div class="skeleton" style="width:150px;height:225px;border-radius:8px;flex-shrink:0"></div>
    </div>
  </div>

  <!-- Category Rows -->
  <div id="shows-categories" style="padding:24px 0 40px;display:none"></div>

  <!-- Grid View (search / see-all) -->
  <div id="shows-grid-wrapper"
    style="padding:0 var(--space-margin-desktop) 40px;max-width:var(--space-container-max);margin:0 auto;display:none">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
      <button id="back-to-shows" onclick="TVShowsPage.clearSearch()"
        style="display:none;align-items:center;gap:6px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 14px;font-size:13px;color:rgba(229,226,225,0.7);cursor:pointer">
        <span class="material-symbols-outlined" style="font-size:16px">arrow_back</span> Back
      </button>
      <h2 id="shows-grid-heading" class="section-title"></h2>
    </div>
    <div class="poster-grid" id="shows-grid"></div>
    <div id="shows-no-results" style="display:none;text-align:center;padding:60px 0">
      <span class="material-symbols-outlined"
        style="font-size:64px;color:rgba(229,226,225,0.15);display:block;margin-bottom:16px">tv_off</span>
      <p style="color:rgba(229,226,225,0.4)">No shows found.</p>
    </div>
  </div>

  <!-- ── Adcash Banner Ad ── -->
  <div style="display:flex;justify-content:center;align-items:center;padding:24px var(--space-margin-desktop);">
    <div>
      <script type="text/javascript">
        aclib.runBanner({ zoneId: 'x89bizpkdk' });
      </script>
    </div>
  </div>

  <div id="footer-mount"></div>
  <div id="mobile-nav-mount"></div>

  <style>
    .category-section .scroll-row {
      display: flex;
      overflow-x: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
    }

    .category-section .scroll-row::-webkit-scrollbar {
      height: 4px;
    }

    .category-section .scroll-row::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    @keyframes skeleton-pulse {

      0%,
      100% {
        opacity: 0.4;
      }

      50% {
        opacity: 0.7;
      }
    }
  </style>
</div>
