<!-- CineStream Login / Register Page -->
<div id="login-page" style="min-height:100vh;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden">
  <!-- Cinematic Backdrop -->
  <div style="position:absolute;inset:0;z-index:0">
    <img id="auth-bg" src="https://images.unsplash.com/photo-1626814026160-2237a95fc5a0?w=1920&q=80&auto=format"
         alt="" style="width:100%;height:100%;object-fit:cover;filter:brightness(0.28) saturate(0.7)">
    <div style="position:absolute;inset:0;background:linear-gradient(135deg,rgba(14,14,14,0.95) 0%,rgba(14,14,14,0.65) 100%)"></div>
    <!-- Floating orbs -->
    <div style="position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(229,9,20,0.12) 0%,transparent 70%);top:-100px;left:-100px;border-radius:50%;animation:float 8s ease-in-out infinite"></div>
    <div style="position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(20,209,255,0.08) 0%,transparent 70%);bottom:-80px;right:-80px;border-radius:50%;animation:float 6s ease-in-out infinite 2s"></div>
  </div>

  <!-- Auth Content -->
  <div style="position:relative;z-index:10;width:100%;max-width:460px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:32px">
    <!-- Logo -->
    <div class="animate-logo" style="text-align:center">
      <div style="font-family:'Montserrat',sans-serif;font-size:42px;font-weight:900;color:#e50914;letter-spacing:-0.04em;line-height:1">CineStream</div>
      <p style="font-size:12px;color:rgba(229,226,225,0.4);letter-spacing:0.15em;text-transform:uppercase;margin-top:6px">Premium Cinema Streaming</p>
    </div>

    <!-- Auth Card -->
    <div class="auth-card animate-fade-up delay-200" style="width:100%">
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" id="tab-login" onclick="LoginPage.switchTab('login')">Sign In</button>
        <button class="tab-btn" id="tab-register" onclick="LoginPage.switchTab('register')">Create Account</button>
      </div>

      <!-- ── LOGIN FORM ── -->
      <div id="form-login">
        <div style="display:flex;flex-direction:column;gap:16px">
          <div>
            <label class="input-label" for="login-email">Email Address</label>
            <input class="input-field" type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
          </div>
          <div>
            <label class="input-label" for="login-password">Password</label>
            <div style="position:relative">
              <input class="input-field" type="password" id="login-password" placeholder="Enter password" autocomplete="current-password" style="padding-right:48px">
              <button onclick="LoginPage.togglePassword('login-password')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(229,226,225,0.4);display:flex;align-items:center">
                <span class="material-symbols-outlined" id="pw-toggle-login" style="font-size:20px">visibility</span>
              </button>
            </div>
          </div>
          <div style="text-align:right;margin-top:-6px">
            <a onclick="LoginPage.showForgotPassword()" style="font-size:13px;color:var(--c-secondary-container);cursor:pointer">Forgot password?</a>
          </div>
        </div>

        <div id="login-error" style="display:none;margin:14px 0;padding:12px 16px;background:rgba(147,0,10,0.2);border:1px solid rgba(255,75,75,0.3);border-radius:6px;font-size:13px;color:#ff6b6b"></div>

        <button class="btn btn-primary" id="login-btn" onclick="LoginPage.signIn()" style="width:100%;margin-top:20px;padding:15px;font-size:15px">
          <span class="material-symbols-outlined icon-fill">login</span>
          Sign In
        </button>

        <div style="display:flex;align-items:center;gap:12px;margin:20px 0">
          <div style="flex:1;height:1px;background:rgba(255,255,255,0.08)"></div>
          <span style="font-size:12px;color:rgba(229,226,225,0.3);letter-spacing:0.05em">OR</span>
          <div style="flex:1;height:1px;background:rgba(255,255,255,0.08)"></div>
        </div>

        <button class="btn-google" id="google-login-btn" onclick="LoginPage.signInWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Continue with Google
        </button>
      </div>

      <!-- ── REGISTER FORM ── -->
      <div id="form-register" style="display:none">
        <div style="display:flex;flex-direction:column;gap:16px">
          <div>
            <label class="input-label" for="reg-name">Full Name</label>
            <input class="input-field" type="text" id="reg-name" placeholder="Your full name" autocomplete="name">
          </div>
          <div>
            <label class="input-label" for="reg-email">Email Address</label>
            <input class="input-field" type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
          </div>
          <div>
            <label class="input-label" for="reg-password">Password</label>
            <div style="position:relative">
              <input class="input-field" type="password" id="reg-password" placeholder="Min 8 characters" autocomplete="new-password" style="padding-right:48px">
              <button onclick="LoginPage.togglePassword('reg-password')" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:rgba(229,226,225,0.4);display:flex;align-items:center">
                <span class="material-symbols-outlined" id="pw-toggle-reg" style="font-size:20px">visibility</span>
              </button>
            </div>
            <!-- Password strength -->
            <div id="pw-strength" style="display:flex;gap:4px;margin-top:8px">
              <div class="pw-bar" style="height:3px;flex:1;background:rgba(255,255,255,0.1);border-radius:2px;transition:background 0.3s"></div>
              <div class="pw-bar" style="height:3px;flex:1;background:rgba(255,255,255,0.1);border-radius:2px;transition:background 0.3s"></div>
              <div class="pw-bar" style="height:3px;flex:1;background:rgba(255,255,255,0.1);border-radius:2px;transition:background 0.3s"></div>
              <div class="pw-bar" style="height:3px;flex:1;background:rgba(255,255,255,0.1);border-radius:2px;transition:background 0.3s"></div>
            </div>
          </div>
          <div>
            <label class="input-label" for="reg-confirm">Confirm Password</label>
            <input class="input-field" type="password" id="reg-confirm" placeholder="Re-enter password" autocomplete="new-password">
          </div>
        </div>

        <div id="reg-error" style="display:none;margin:14px 0;padding:12px 16px;background:rgba(147,0,10,0.2);border:1px solid rgba(255,75,75,0.3);border-radius:6px;font-size:13px;color:#ff6b6b"></div>

        <button class="btn btn-primary" id="register-btn" onclick="LoginPage.register()" style="width:100%;margin-top:20px;padding:15px;font-size:15px">
          <span class="material-symbols-outlined icon-fill">person_add</span>
          Create Account
        </button>

        <div style="display:flex;align-items:center;gap:12px;margin:20px 0">
          <div style="flex:1;height:1px;background:rgba(255,255,255,0.08)"></div>
          <span style="font-size:12px;color:rgba(229,226,225,0.3);letter-spacing:0.05em">OR</span>
          <div style="flex:1;height:1px;background:rgba(255,255,255,0.08)"></div>
        </div>

        <button class="btn-google" onclick="LoginPage.signInWithGoogle()">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.35-8.16 2.35-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          Sign up with Google
        </button>

        <p style="font-size:12px;color:rgba(229,226,225,0.3);text-align:center;margin-top:16px;line-height:1.6">
          By creating an account you agree to our <a href="#" style="color:var(--c-secondary-container)">Terms of Service</a> and <a href="#" style="color:var(--c-secondary-container)">Privacy Policy</a>.
        </p>
      </div>

      <!-- ── FORGOT PASSWORD FORM ── -->
      <div id="form-forgot" style="display:none">
        <p style="font-size:14px;color:rgba(229,226,225,0.6);margin-bottom:20px;line-height:1.6">Enter your email and we'll send you a link to reset your password.</p>
        <div>
          <label class="input-label" for="forgot-email">Email Address</label>
          <input class="input-field" type="email" id="forgot-email" placeholder="you@example.com">
        </div>
        <button class="btn btn-primary" onclick="LoginPage.sendReset()" style="width:100%;margin-top:16px;padding:14px">Send Reset Link</button>
        <button onclick="LoginPage.switchTab('login')" style="width:100%;margin-top:12px;background:none;border:none;cursor:pointer;color:rgba(229,226,225,0.5);font-size:14px">
          ← Back to Sign In
        </button>
      </div>
    </div>

    <!-- Trial teaser -->
    <div class="animate-fade-up delay-400" style="text-align:center;max-width:320px">
      <p style="font-size:12px;color:rgba(229,226,225,0.3);line-height:1.7">
        🎬 Stream <strong style="color:rgba(229,226,225,0.6)">4K Ultra HD</strong> movies · <strong style="color:rgba(229,226,225,0.6)">Exclusive originals</strong> · 
        <a onclick="Router.navigate('subscribe')" style="color:var(--c-secondary-container);cursor:pointer">View Plans →</a>
      </p>
    </div>
  </div>
</div>
