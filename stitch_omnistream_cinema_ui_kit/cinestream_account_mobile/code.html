<body class="font-body-md text-body-md overflow-x-hidden">
<!-- TopNavBar Integration (from Shared Components) -->
<header class="bg-surface/70 backdrop-blur-xl border-b border-white/10 shadow-2xl flex justify-between items-center px-5 h-20 w-full z-50 sticky top-0 md:px-gutter-desktop">
<div class="flex items-center gap-4">

</div>
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/5 transition-all duration-300 active:scale-95">
<span class="material-symbols-outlined text-on-surface" data-icon="search">search</span>
</button>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-white/5 transition-all duration-300 active:scale-95 relative">
<span class="material-symbols-outlined text-on-surface" data-icon="notifications">notifications</span>

</button>

</div>
<button class="absolute bottom-0 right-0 bg-primary-container text-on-primary-container w-8 h-8 rounded-full flex items-center justify-center shadow-lg border-2 border-background scale-105 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[18px]" data-icon="edit">edit</span>
</button>
</div>
<div class="mt-4 text-center">
<h1 class="font-headline-md text-headline-md text-on-surface">Alex Thompson</h1>
<p class="font-label-md text-label-md text-secondary-fixed opacity-80 mt-1">Premium Member</p>
</div>
</section>
<!-- Account Actions Grid/List -->
<div class="space-y-4">
<!-- Category: Account -->
<div class="space-y-2">
<h2 class="font-label-md text-label-md text-on-surface-variant px-2">ACCOUNT</h2>
<!-- Profile Link -->
<button class="w-full glass-panel rounded-xl p-4 flex items-center justify-between group transition-all duration-300 hover:bg-white/5 active:scale-[0.98]">

<div class="w-10 h-10 rounded-lg bg-surface-container flex items-center justify-center text-primary-container group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
<div class="text-left">
<p class="font-body-md text-body-md text-on-surface">Profile Information</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Email, Password, Personal Info</p>
</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant group-hover:translate-x-1 transition-transform" data-icon="chevron_right">chevron_right</span>
</button>
<!-- Subscription Link -->
<button class="w-full glass-panel rounded-xl p-4 flex items-center justify-between group transition-all duration-300 hover:bg-white/5 active:scale-[0.98]">

<div class="text-left">

</button>
</div>

<div class="pt-6">
<button class="w-full border border-white/10 rounded-xl p-4 flex items-center justify-center gap-3 text-error transition-all duration-300 hover:bg-error-container/10 active:scale-[0.98]">

<span class="font-label-md">Sign Out</span>
</button>

<span class="font-headline-md text-primary-container">CineStream</span>

</button>
<button class="flex flex-col items-center gap-1 text-on-surface/70 hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" data-icon="live_tv">live_tv</span>

</button>
<button class="flex flex-col items-center gap-1 text-primary-container">
<span class="material-symbols-outlined" data-icon="account_circle" style="font-variation-settings: 'FILL' 1;">account_circle</span>
<span class="font-label-sm text-[10px]">Profile</span>
</button>

<script>
        // Simple micro-interaction for list items
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.classList.add('scale-[0.98]');
            });
            button.addEventListener('touchend', () => {
                button.classList.remove('scale-[0.98]');
            });
        });
    </script>
