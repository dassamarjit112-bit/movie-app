name: Build Android APK (TWA)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK using Bubblewrap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Debug & Setup Android SDK
        run: |
          echo "=== ENV VARS ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

          # Resolve the actual SDK path (try both common variables)
          SDK_PATH="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using SDK_PATH=$SDK_PATH"

          echo "=== SDK Contents ==="
          ls "$SDK_PATH" || echo "SDK dir not found!"

          # Find sdkmanager (it may be in different cmdline-tools subdirs)
          SDKMANAGER=$(find "$SDK_PATH/cmdline-tools" -name "sdkmanager" -type f 2>/dev/null | head -1)
          echo "Found sdkmanager at: $SDKMANAGER"

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "build-tools;34.0.0" "platforms;android-34" || true
          fi

          echo "=== build-tools contents ==="
          ls "$SDK_PATH/build-tools" || echo "No build-tools dir!"

      - name: Configure Bubblewrap
        run: |
          # Use Node.js to write config — guarantees proper env var expansion
          node -e "
            const fs = require('fs');
            const path = require('path');
            const os = require('os');

            const sdkPath = process.env.ANDROID_HOME || process.env.ANDROID_SDK_ROOT || '';
            const jdkPath = process.env.JAVA_HOME || '';

            const config = { jdkPath, androidSdkPath: sdkPath };
            console.log('Writing bubblewrap config:', JSON.stringify(config, null, 2));

            const configDir = path.join(os.homedir(), '.bubblewrap');
            fs.mkdirSync(configDir, { recursive: true });
            fs.writeFileSync(path.join(configDir, 'config.json'), JSON.stringify(config, null, 2));
            console.log('Done.');
          "

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=SDCineStream, OU=Dev, O=CineStream, L=Unknown, S=Unknown, C=IN"

      - name: Build APK
        working-directory: ./android-app
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: password123
          BUBBLEWRAP_KEY_PASSWORD: password123
        run: |
          bubblewrap build --skipPwaValidation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDCineStream-App
          path: |
            ./android-app/app-release-signed.apk
            ./android-app/app-release-unsigned.apk
