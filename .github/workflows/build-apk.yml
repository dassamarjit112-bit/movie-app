name: Build Android APK (TWA)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build TWA APK with Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses & Install Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Download App Icons
        run: |
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi

          # Download the app icon from the live PWA
          curl -L "https://sdcinestream.qzz.io/icons/icon-192.png" -o /tmp/icon-192.png
          curl -L "https://sdcinestream.qzz.io/icons/icon-512.png" -o /tmp/icon-512.png

          # Install imagemagick for icon resizing
          sudo apt-get install -y imagemagick > /dev/null 2>&1

          # Resize to each density
          convert /tmp/icon-192.png -resize 48x48  android-app/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert /tmp/icon-192.png -resize 72x72  android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert /tmp/icon-192.png -resize 96x96  android-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert /tmp/icon-192.png -resize 144x144 android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert /tmp/icon-512.png -resize 192x192 android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=SDCineStream, OU=Dev, O=CineStream, L=Unknown, S=Unknown, C=IN"

      - name: Make gradlew executable
        run: chmod +x android-app/gradlew

      - name: Build Release APK
        working-directory: android-app
        env:
          KEYSTORE_PASSWORD: password123
          KEY_PASSWORD: password123
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk SDCineStream.apk || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDCineStream-APK
          path: |
            SDCineStream.apk
            android-app/app/build/outputs/apk/release/app-release.apk
