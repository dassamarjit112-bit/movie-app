name: Build Android APK (TWA) — SD CineStream

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Fullscreen TWA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK Licenses & Install Build Tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Install ImageMagick
        run: sudo apt-get install -y imagemagick > /dev/null 2>&1

      - name: Download & Generate App Icons
        run: |
          mkdir -p android-app/app/src/main/res/mipmap-mdpi
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          mkdir -p android-app/app/src/main/res/mipmap-xhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxhdpi
          mkdir -p android-app/app/src/main/res/mipmap-xxxhdpi

          # Try downloading icon from the live site first
          curl -L --max-time 15 "https://sdcinestream.qzz.io/icons/icon-512.png" -o /tmp/icon-512.png 2>/dev/null || \
          curl -L --max-time 15 "https://sdcinestream.qzz.io/public/app-icon.jpg" -o /tmp/icon-512.png 2>/dev/null || \
          convert -size 512x512 xc:'#e50914' -fill white -pointsize 72 -gravity center \
            -annotate 0 'SD\nCine' /tmp/icon-512.png

          curl -L --max-time 15 "https://sdcinestream.qzz.io/icons/icon-192.png" -o /tmp/icon-192.png 2>/dev/null || \
            cp /tmp/icon-512.png /tmp/icon-192.png

          # Resize to all densities
          convert /tmp/icon-192.png -resize 48x48   android-app/app/src/main/res/mipmap-mdpi/ic_launcher.png
          convert /tmp/icon-192.png -resize 72x72   android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert /tmp/icon-192.png -resize 96x96   android-app/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert /tmp/icon-192.png -resize 144x144  android-app/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert /tmp/icon-512.png -resize 192x192  android-app/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "✅ Icons generated successfully"

      - name: Generate Splash Screen (remove old first)
        run: |
          mkdir -p android-app/app/src/main/res/drawable
          
          # Remove any existing splash files to prevent duplicate resource error
          rm -f android-app/app/src/main/res/drawable/splash.png
          rm -f android-app/app/src/main/res/drawable/splash.jpg

          # Create a professional splash screen (dark bg + centered logo)
          convert -size 1080x1920 xc:'#0e0e0e' \
            /tmp/icon-512.png -resize 320x320 -gravity center -composite \
            android-app/app/src/main/res/drawable/splash.png 2>/dev/null || \
          convert -size 1080x1920 xc:'#0e0e0e' \
            android-app/app/src/main/res/drawable/splash.png

          echo "✅ Splash screen generated (old splash files cleaned)"

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=SDCineStream, OU=Dev, O=SDCineStream, L=India, S=WB, C=IN"
          echo "✅ Keystore generated"

      - name: Make gradlew executable
        run: chmod +x android-app/gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Release APK
        working-directory: android-app
        env:
          KEYSTORE_PASSWORD: password123
          KEY_PASSWORD: password123
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          ./gradlew assembleRelease \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m"
          echo "✅ APK built successfully"

      - name: Sign APK (zipalign + apksigner)
        run: |
          # Find the APK
          APK_PATH=$(find android-app/app/build/outputs/apk/release/ -name "*.apk" | head -1)
          
          # Zipalign
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 "$APK_PATH" SDCineStream-aligned.apk
          
          # Sign with apksigner
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks android.keystore \
            --ks-key-alias android \
            --ks-pass pass:password123 \
            --key-pass pass:password123 \
            --out SDCineStream.apk \
            SDCineStream-aligned.apk
          
          echo "✅ APK signed: SDCineStream.apk"
          ls -lh SDCineStream.apk

      - name: Verify APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose SDCineStream.apk || true
          echo "APK Info:"
          $ANDROID_HOME/build-tools/34.0.0/aapt dump badging SDCineStream.apk | head -5 || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDCineStream-APK-v2
          path: |
            SDCineStream.apk
          retention-days: 30

      - name: Upload to Public Folder
        run: |
          cp SDCineStream.apk public/SDCineStream.apk || true
          echo "✅ APK copied to public/ folder"

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v2.1.${{ github.run_number }}"
          name: "SD CineStream APK v2.1.${{ github.run_number }}"
          body: |
            ## 🎬 SD CineStream Android App v2.1

            **Fullscreen immersive TWA app** — looks exactly like a native app!

            ### ✨ What's new in v2.1:
            - 🔲 Full screen immersive mode (no browser UI visible)
            - 🎬 **15+ streaming servers** with auto-fallback (VidSrc, 2Embed, VidLink, Embed.su, MoviesAPI, StreamIMDb, DBgo & more)
            - 🛡️ **Auto server switching** — if one server fails, app automatically switches to the next working server
            - 🇮🇳 **India-optimized servers** — works great with Indian ISPs for Bollywood, Hollywood & South Indian movies
            - 🎨 **Enhanced player UI** — gradient overlay, server health indicator, pulsing active server
            - 🔔 Push notifications enabled
            - 📱 Works on Android 5.0+ (API 21+)
            - ⚡ Fast startup with custom splash screen

            ### 📥 Install:
            1. Download **SDCineStream.apk** below
            2. Enable "Install from unknown sources" in Android settings
            3. Install and enjoy!

            **Website:** https://sdcinestream.qzz.io
          files: SDCineStream.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}