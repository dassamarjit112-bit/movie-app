name: Build Android APK (TWA)

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to run this manually from the Actions tab

jobs:
  build:
    name: Build APK using Bubblewrap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Setup Android SDK
        run: |
          # Print SDK path for debugging
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls "$ANDROID_HOME" || true

          # Install required SDK components
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;34.0.0" "platforms;android-34"

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          # Use printf to avoid heredoc variable expansion issues
          printf '{\n  "jdkPath": "%s",\n  "androidSdkPath": "%s"\n}\n' \
            "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          echo "Bubblewrap config:"
          cat ~/.bubblewrap/config.json

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore android.keystore \
            -alias android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass password123 \
            -keypass password123 \
            -dname "CN=SDCineStream, OU=Dev, O=CineStream, L=Unknown, S=Unknown, C=IN"

      - name: Build APK
        working-directory: ./android-app
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: password123
          BUBBLEWRAP_KEY_PASSWORD: password123
        run: |
          bubblewrap build --skipPwaValidation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SDCineStream-App
          path: |
            ./android-app/app-release-signed.apk
            ./android-app/app-release-unsigned.apk
