    /* Initial page loader */
    #initial-loader {

      inset: 0;
      background: #0e0e0e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 9999;

    #initial-loader .logo-text {

      letter-spacing: -0.04em;

    #initial-loader .tagline {

      color: rgba(229, 226, 225, 0.4);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      animation: fade-in 1s ease 0.4s both;
    }

    #initial-loader .loader-bar {
      width: 120px;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      animation: fade-in 0.5s ease 0.3s both;
    }

    #initial-loader .loader-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e50914, #14d1ff);
      border-radius: 999px;
      transition: width 2s ease;
    }

    #initial-loader.fadeout {
      opacity: 0;
      pointer-events: none;
    }

    /* Top loading bar */
    #top-loading-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, #e50914, #14d1ff);
      z-index: 9999;
      transition: width 0.3s ease, opacity 0.3s ease;

    /* Global Ad Banner */

  <script>
    // ── Bootstrap Application ──
    (async function bootstrap() {
      // Animate loader bar
      const fill = document.getElementById('loader-fill');
      if (fill) {
        setTimeout(() => fill.style.width = '75%', 100);
        setTimeout(() => fill.style.width = '100%', 800);
      }

      // Safety timeout: guarantee loading screen removal after 3 seconds max
      const removeLoader = () => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.classList.add('fadeout');
          setTimeout(() => loader.remove(), 600);
        }
      };
      const safetyTimer = setTimeout(removeLoader, 3000);

      try {
        // Wait for DOM + font load with a fallback timeout
        await Promise.race([
          document.fonts.ready,
          new Promise(r => setTimeout(r, 1000))
        ]);

        // Get session, handle rejections safely
        if (window.sb && window.sb.auth) {
          await window.sb.auth.getSession().catch(err => console.warn('Auth check skipped:', err));
        }

        // Short min display time for branding
        await new Promise(r => setTimeout(r, 1000));

        // Success: remove loader
        clearTimeout(safetyTimer);
        removeLoader();

        // Initialize router
        if (window.Router) {
          window.Router.init();
        } else {
          console.error('Router not loaded!');
        }

        // Handle auth state changes globally
        if (window.Auth && window.Auth.onAuthChange) {
          window.Auth.onAuthChange((session) => {
            if (session && window.UI) {
              UI.updateNavbarUser();
            }
          });
        }

        // Initialize notification system
        if (window.NotificationSystem) {
          window.NotificationSystem.init();
        }
      } catch (err) {
        console.error('Bootstrap error occurred:', err);
        clearTimeout(safetyTimer);
        removeLoader();
        if (window.Router) window.Router.init();
      }
    })();
</script>
