  <style>
    /* App shell base */
    #app {
      min-height: 100vh;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      position: relative;
    }

    /* Initial page loader (New Splash Screen) */
    #initial-loader {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #111a30 0%, #050810 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s ease;
      overflow: hidden;
    }

    /* Starry Background Animation */
    .splash-stars {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 40px 70px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 40px, rgba(255,255,255,0.8), rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.8), rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      animation: stars-move 100s linear infinite;
      opacity: 0.5;
    }
    @keyframes stars-move { from { transform: translateY(0); } to { transform: translateY(-200px); } }

    /* Floating Posters */
    .splash-posters {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.4;
      z-index: 0;
    }
    .splash-poster {
      position: absolute;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      object-fit: cover;
      transform-origin: center;
      animation: float-poster 6s ease-in-out infinite alternate;
    }
    @keyframes float-poster {
      0% { transform: translateY(0px) scale(1) rotate(0deg); }
      100% { transform: translateY(-15px) scale(1.02) rotate(2deg); }
    }
    /* Poster positions */
    .sp-1 { width:16vw; top:-5%; left:5%; animation-delay: 0s; transform: rotate(-5deg); filter: blur(1px) brightness(0.7); }
    .sp-2 { width:20vw; top:10%; right:10%; animation-delay: -2s; transform: rotate(5deg); }
    .sp-3 { width:18vw; top:25%; left:-5%; animation-delay: -1s; transform: rotate(8deg); }
    .sp-4 { width:15vw; top:40%; right:-2%; animation-delay: -3s; transform: rotate(-6deg); filter: blur(2px) brightness(0.6); }
    .sp-5 { width:17vw; bottom:15%; left:12%; animation-delay: -4s; transform: rotate(-8deg); }
    .sp-6 { width:19vw; bottom:5%; right:15%; animation-delay: -1.5s; transform: rotate(4deg); }
    .sp-7 { width:14vw; bottom:-10%; left:35%; animation-delay: -2.5s; transform: rotate(-2deg); filter: blur(1px) brightness(0.8); }

    /* Splash Content */
    .splash-content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .splash-logo-svg {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      filter: drop-shadow(0 0 15px rgba(20, 209, 255, 0.6));
      animation: logo-pulse 2s ease-in-out infinite alternate;
    }
    @keyframes logo-pulse {
      0% { transform: scale(0.95); filter: drop-shadow(0 0 10px rgba(20, 209, 255, 0.4)); }
      100% { transform: scale(1.05); filter: drop-shadow(0 0 25px rgba(20, 209, 255, 0.8)); }
    }

    #initial-loader .logo-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 46px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.02em;
      margin-bottom: 12px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.8);
      animation: logo-appear 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    #initial-loader .logo-text span.sd {
      color: #ff8a00;
    }

    #initial-loader .tagline {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.04em;
      margin-bottom: 12px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      animation: fade-in 1s ease 0.4s both;
    }

    #initial-loader .sub-tagline {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.5;
      max-width: 300px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      animation: fade-in 1s ease 0.6s both;
    }

    .loader-spinner {
      margin-top: 40px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ff8a00;
      border-radius: 50%;
      animation: loader-spin 1s linear infinite;
    }
    @keyframes loader-spin {
      to { transform: rotate(360deg); }
    }

    #initial-loader.fadeout {
      opacity: 0;
      pointer-events: none;
    }

    /* Top loading bar */
    #top-loading-bar {

      top: 0;
      left: 0;
      height: 2px;
      width: 0%;
      background: linear-gradient(90deg, #e50914, #14d1ff);
      z-index: 9999;
      transition: width 0.3s ease, opacity 0.3s ease;
      opacity: 0;
    }

    /* Global Ad Banner */
    #global-ad-banner {

      display: flex;
      justify-content: center;

  <script type="module">
    // ── Bootstrap Application ──
    (async function bootstrap() {
      // Animate loader bar
      const fill = document.getElementById('loader-fill');
      if (fill) {
        setTimeout(() => fill.style.width = '75%', 100);
        setTimeout(() => fill.style.width = '100%', 800);
      }

      // Safety timeout: guarantee loading screen removal after 3 seconds max
      const removeLoader = () => {
        const loader = document.getElementById('initial-loader');
        if (loader) {
          loader.classList.add('fadeout');
          setTimeout(() => loader.remove(), 600);
        }
      };
      const safetyTimer = setTimeout(() => {
        removeLoader();
        if (window.Router && !window.Router.initialized) {
          window.Router.initialized = true;
          window.Router.init();
        }
      }, 3000);

      try {
        // Wait for DOM + font load with a fallback timeout
        await Promise.race([
          document.fonts.ready,
          new Promise(r => setTimeout(r, 1000))
        ]);

        // Get session, handle rejections safely (max 2 seconds wait)
        if (window.sb && window.sb.auth) {
          await Promise.race([
            window.sb.auth.getSession(),
            new Promise((resolve) => setTimeout(resolve, 2000))
          ]).catch(err => console.warn('Auth check skipped:', err));
        }

        // Short min display time for branding
        await new Promise(r => setTimeout(r, 1000));

        // Success: remove loader
        clearTimeout(safetyTimer);
        removeLoader();

        // Initialize router
        if (window.Router && !window.Router.initialized) {
          window.Router.initialized = true;
          window.Router.init();
        } else if (!window.Router) {
          console.error('Router not loaded!');
        }

        // Handle auth state changes globally
        if (window.Auth && window.Auth.onAuthChange) {
          window.Auth.onAuthChange((session) => {
            if (session && window.UI) {
              UI.updateNavbarUser();
            }
          });
        }

        // Initialize notification system
        if (window.NotificationSystem) {
          window.NotificationSystem.init();
        }
      } catch (err) {
        console.error('Bootstrap error occurred:', err);
        clearTimeout(safetyTimer);
        removeLoader();
        if (window.Router) window.Router.init();
      }
    })();
</script>
